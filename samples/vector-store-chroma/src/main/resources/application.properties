spring.application.name=vector-store-chroma

# Ollama服务地址
spring.ai.ollama.base-url=http://localhost:11434

# Embedding模型
spring.ai.ollama.embedding.options.model=nomic-embed-text

# 向量数据库Chroma服务地址
spring.ai.vectorstore.chroma.client-url=http://localhost:8000

# Chroma集合属性
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.vectorstore.chroma.collection-name=VectorStoreChroma