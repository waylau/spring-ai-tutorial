spring.application.name=chatbot-demo

# Ollama服务地址
spring.ai.ollama.base-url=http://localhost:11434

# 配置默认调用的AI模型
spring.ai.ollama.chat.options.model=qwen3.5:2b

# 配置模型的温度系数（可选）
spring.ai.ollama.chat.options.temperature=0.7

# 上下文长度，适配qwen3.5:0.8b模型上限
spring.ai.ollama.chat.options.num_ctx=2048

# 开启流式输出，适配前端打字机效果
spring.ai.ollama.chat.options.stream=true

# 会话过期时间（秒），默认1小时，无交互自动过期
spring.ai.chatbot.session.expire-time=3600

# Redis服务地址、服务端口
spring.redis.host=localhost
spring.redis.port=6379